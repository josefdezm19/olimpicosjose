<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:linear-gradient(180deg,#fff,#EDEDF0);font-family:Inter,sans-serif;display:flex;gap:70px;justify-content:center;padding:70px 60px 50px}
.ph{display:flex;flex-direction:column;align-items:center;gap:22px}
.dev{width:430px;height:902px;border-radius:72px;padding:14px;background:linear-gradient(145deg,#C9C4BC,#8D8A85 45%,#B8B3AB);box-shadow:0 40px 80px rgba(0,0,0,.18),inset 0 0 0 2px rgba(255,255,255,.4)}
.scr{width:402px;height:874px;border-radius:58px;overflow:hidden;position:relative;background:#fff;box-shadow:0 0 0 3px #111}
.scr img{width:402px;display:block}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:2}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:4px 36px 0 44px;font-weight:600;font-size:16px;z-index:1;background:linear-gradient(#fff 70%,rgba(255,255,255,0))}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#111;z-index:2}
.cap{font-size:17px;color:#6E6E73}
</style></head><body>
<div class="ph"><div class="dev"><div class="scr"><div class="sb"><span>9:41</span><span>●●● ▮</span></div><div class="island"></div><img src="s1.png"><div class="home"></div></div></div><div class="cap">Inicio · tus datos y semanas</div></div>

</body></html>
